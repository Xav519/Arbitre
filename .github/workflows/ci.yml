name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and offline attack bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make install
      - run: make test
      - name: Offline attack bench
        run: |
          python -m innovabank_harness run --target offline --mode vulnerable --out results/offline-vulnerable.json
          python -m innovabank_harness run --target offline --mode hardened --out results/offline-hardened.json
          python -m innovabank_harness report --vulnerable results/offline-vulnerable.json --hardened results/offline-hardened.json --out results/offline.md
          cat results/offline.md >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONPATH: app:harness:supplychain
      - name: Regression guard, hardened posture
        run: python tests/check_regression.py results/offline-hardened.json

  supply-chain:
    name: AI supply chain gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml
      - name: Provenance, artifact scan, ML-BOM
        run: python -m ib_supplychain gate --bom ml-bom.cdx.json
        env:
          PYTHONPATH: supplychain
      - name: Prove the scanner rejects a malicious artifact
        run: |
          python supplychain/make_demo_fixture.py "$RUNNER_TEMP/demo"
          if python -m ib_supplychain scan "$RUNNER_TEMP/demo"; then
            echo "scanner accepted a malicious pickle" && exit 1
          fi
        env:
          PYTHONPATH: supplychain
      - uses: actions/upload-artifact@v4
        with:
          name: ml-bom
          path: ml-bom.cdx.json

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate every root
        run: |
          for root in infra/envs/vulnerable infra/envs/hardened infra/account; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
