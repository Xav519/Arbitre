[project]
name = "innovabank"
version = "1.0.0"
description = "An agentic banking assistant on AWS in two postures, vulnerable and hardened, with one automated attack bench against both."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xavier Dupuis" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "harness", "supplychain"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle errors and warnings, import order, bugbear, pyupgrade, pylint errors.
# E501 is left out: long lines are mostly test fixtures and attack strings.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "PLE"]

[tool.ruff.lint.isort]
known-first-party = ["innovabank", "innovabank_harness", "ib_supplychain"]
